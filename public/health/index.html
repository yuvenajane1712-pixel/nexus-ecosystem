<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Health Tracker · NEXUS</title>
<link rel="stylesheet" href="/style.css" />
<link rel="manifest" href="/health/manifest.json" />
<meta name="theme-color" content="#1F3864" />
</head>
<body>
  <div class="topbar">
    <span><span class="sync-dot" id="syncDot"></span>Health Tracker</span>
    <select id="userSelect" style="width:auto;margin:0;padding:4px 8px;font-size:13px;">
      <option value="Yuvena">Yuvena</option>
      <option value="Nadine">Nadine</option>
    </select>
  </div>

  <main>
    <div class="card">
      <h3>Today — <span id="userLabel">Yuvena</span></h3>
      <div class="row"><span class="label">Calories logged today</span><span class="val" id="calToday">—</span></div>
      <div class="row"><span class="label">Latest weight</span><span class="val" id="latestWeight">—</span></div>
      <div class="row"><span class="label">Reminder</span><span class="val" id="reminder">—</span></div>
    </div>

    <div class="card">
      <h3>🤖 AI Insight (rule-based)</h3>
      <div id="insightBox" class="meta">Loading...</div>
    </div>

    <div class="section-title">Recent Logs</div>
    <div id="logsList"><div class="empty">No logs yet</div></div>
  </main>

  <button class="fab" id="fabBtn">+</button>

  <div class="bottomnav">
    <a href="/"><span class="ic">🏠</span>Home</a>
    <a href="/business/"><span class="ic">💼</span>Business</a>
    <a href="/health/" class="active"><span class="ic">🩺</span>Health</a>
    <a href="/pet/"><span class="ic">🐾</span>Pet</a>
    <a href="/budget/"><span class="ic">💰</span>Budget</a>
  </div>

  <div class="sheet-overlay" id="logSheet">
    <div class="sheet">
      <div class="close" onclick="NEXUS.closeSheet('logSheet')">Close ✕</div>
      <h2>New Health Log</h2>
      <label>Type</label>
      <select id="l_type">
        <option value="diet">Diet / meal</option>
        <option value="workout">Workout</option>
        <option value="metric">Metric (weight, BP, HR, etc.)</option>
        <option value="supplement">Supplement / TCM</option>
        <option value="grocery">Grocery purchase (auto-posts to Budget)</option>
      </select>
      <label>Title</label>
      <input id="l_title" placeholder="e.g. weight / lunch / Muay Thai" />
      <label>Value / notes</label>
      <input id="l_value" placeholder="e.g. 98.4kg / chicken + rice bowl" />
      <label>Calories (if diet)</label>
      <input id="l_calories" type="number" placeholder="450" />
      <label>Cost RMB (if grocery)</label>
      <input id="l_cost" type="number" placeholder="35" />
      <button onclick="submitLog()">Save Log</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared.js"></script>
  <script src="/health/app.js"></script>
</body>
</html>
